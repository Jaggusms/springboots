spring.datasource.url=jdbc:postgresql://localhost:5432/securitydb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=mypassword
spring.cache.type=redis
spring.cache.redis.time-to-live=10m


spring.application.name=aws-ec2-demo
server.port=8080

aws.region=ap-south-1

# Supply an actual AMI ID for the selected AWS region.
aws.ec2.ami-id=${EC2_AMI_ID}

# Example instance type
aws.ec2.instance-type=t3.micro






spring.application.name=aws-msk-springboot
server.port=8081

# AWS MSK connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer configuration
spring.kafka.consumer.group-id=order-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# AWS MSK IAM authentication
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=AWS_MSK_IAM
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler

# Producer reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Topic
app.kafka.topic=order-created
